[package]
name = "mpc-zkproof"
version = "0.1.0"
edition = "2021"

[lib]
name = "mpc_zkproof"
path = "src/lib.rs"

[[bin]]
name = "causal-prover"
path = "src/causal_prover.rs"

[dependencies]
mpc-crypto = { path = "../crypto" }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

[dev-dependencies]
proptest = "1.0"