[package]
name = "mpc-node"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mpc-node"
path = "src/main.rs"

[dependencies]
mpc-crypto = { path = "../crypto" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
log = "0.4"
env_logger = "0.11"